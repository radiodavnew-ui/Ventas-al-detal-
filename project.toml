[_]
schema-version = "0.2"

[project]
name = "control-de-ventas-al-detal"
version = "1.0.0"

[build]
[[build.env]]
name = "GOOGLE_ENTRYPOINT"
value = "node server.ts"

[[build.env]]
name = "GOOGLE_RUNTIME_VERSION"
value = "22"

[[build.env]]
name = "GOOGLE_NODE_RUN_SCRIPTS"
value = "build"

[[build.env]]
name = "NODE_ENV"
value = "production"

[[build.env]]
name = "NODE_OPTIONS"
value = "--experimental-strip-types"

exclude = [
  "build.gradle.kts",
  "settings.gradle.kts",
  "gradle.properties",
  "gradle",
  "gradle/**",
  "app",
  "app/**",
  ".gradle",
  ".gradle/**"
]

